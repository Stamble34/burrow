<!doctype html>
<meta charset="utf-8">
<title>Burrow settings</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; max-width: 520px; }
  label { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; }
  input { margin-top: 4px; }
  small { display: block; opacity: .7; }
</style>
<label><input type="checkbox" id="prompt">
  <span>Ask before adding pages opened from a card
  <small>When off, pages are only added with the capture shortcut or the right-click menu.</small></span></label>
<label><input type="checkbox" id="crumb">
  <span>Show the breadcrumb on pages
  <small>Also toggled with the breadcrumb shortcut.</small></span></label>
<label><span>Search with
  <select id="engine">
    <option value="google">Google</option>
    <option value="duckduckgo">DuckDuckGo</option>
    <option value="bing">Bing</option>
    <option value="wikipedia">Wikipedia</option>
  </select>
  <small>Used by Dive (Alt+Shift+S) and when a card without a page is reopened.</small></span></label>
<label><span>Focus mode
  <select id="focus">
    <option value="off">Off</option>
    <option value="hide">Hide tabs off the current trail</option>
    <option value="discard">Unload tabs off the current trail (they stay in the tab list)</option>
  </select>
  <small>Keeps the trail you're on, the cards next to it and the ones under it. Only tabs that are on the map are touched.</small></span></label>
<p><small>Change the shortcuts in about:addons → gear icon → Manage Extension Shortcuts.</small></p>
<script src="options.js"></script>
