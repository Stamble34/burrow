<!doctype html>
<meta charset="utf-8">
<title>Burrow</title>
<style>
  :root { color-scheme: dark; --accent: #b8a4ff; }
  html, body { margin: 0; background: #0b0b0d; color: #ececf1; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; background: #0b0b0d; padding: 12px 12px 8px; border-bottom: 1px solid rgba(255,255,255,.06); z-index: 1; }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
  h1 small { color: #6e6e7a; font-weight: 400; }
  input { all: unset; box-sizing: border-box; width: 100%; padding: 6px 9px; border-radius: 7px; background: #16161a; border: 1px solid rgba(255,255,255,.07); color: #ececf1; }
  input::placeholder { color: #6e6e7a; }
  ul { list-style: none; margin: 0; padding: 0 0 0 14px; }
  main > ul { padding: 6px 6px 16px; }
  li > .row { display: flex; align-items: center; gap: 7px; padding: 3px 6px; border-radius: 6px; cursor: pointer; min-width: 0; }
  li > .row:hover { background: rgba(255,255,255,.05); }
  .row.cur { background: color-mix(in oklab, var(--accent) 16%, transparent); }
  .row.cur .t { color: #fff; font-weight: 600; }
  .tw { width: 12px; flex: none; color: #6e6e7a; font-size: 10px; text-align: center; }
  .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #c9c9d3; }
  .s-done > .row .t { color: #6e6e7a; }
  .rep .t { color: #6e6e7a; font-style: italic; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .d-todo { background: #8fb8ff; } .d-doing { background: #f6d97a; } .d-done { border: 1.5px solid #5f5f69; } .d-parked { border: 1.5px dashed #9a8f80; }
  .tab { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex: none; margin-left: auto; }
  .closed > ul { display: none; }
  .empty { color: #6e6e7a; padding: 14px; }
</style>
<header><h1><span id="board">Burrow</span><small id="count"></small></h1><input id="q" placeholder="Filter" spellcheck="false"></header>
<main id="tree"><p class="empty">Loading…</p></main>
<script src="sidebar.js"></script>
